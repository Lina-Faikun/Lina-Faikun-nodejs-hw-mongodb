openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: |
    Це API для керування контактами. Можна створювати, редагувати, видаляти, шукати контакти.
tags:
  - name: Contacts
    description: Операції з контактами
servers:
  - url: http://localhost:3000
  - url: https://{твій-деплой}.onrender.com
paths:
  /contacts:
    $ref: "../swagger/paths/contacts/get.yaml"
  /contacts/{id}:
    get:
      $ref: "../swagger/paths/contacts/{id}/get.yaml"
    patch:
      $ref: "../swagger/paths/contacts/{id}/patch.yaml"
    delete:
      $ref: "../swagger/paths/contacts/{id}/delete.yaml"
  /contacts:
    post:
      $ref: "../swagger/paths/contacts/post.yaml"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Contact:
      $ref: "../swagger/components/schemas/Contact.yaml"
